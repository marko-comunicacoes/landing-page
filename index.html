<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marko Comunicações — Em construção</title>
  <link rel="stylesheet" href="./design-system/tokens.css">
  <link rel="stylesheet" href="./design-system/bundle.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--surface); color: var(--ink); font-family: var(--font-sans); }
    .mk-construction {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .mk-construction .mk-inner {
      width: 100%;
      flex: 1;
      justify-content: space-between;
    }
    .mk-construction__main {
      margin-block: auto;
      padding-block: var(--space-16);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: var(--space-6);
    }
    .mk-construction .mk-tag { text-decoration: none; }
  </style>
</head>
<body class="mk-root">
  <main class="mk-section mk-construction">
    <div class="mk-inner">
      <header class="mk-hero__top">
        <div class="mk-dots" aria-hidden="true"></div>
        <span class="mk-tag">
          <img src="./design-system/assets/marko-simbolo.jpg" alt="" width="24" height="24">
          Marko Comunicações
        </span>
      </header>

      <div class="mk-construction__main">
        <h1 class="mk-title"><em>Em</em> <strong>construção</strong></h1>
      </div>
    </div>
  </main>
</body>
</html>
